<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气图像生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 30px 0;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
            text-align: center;
        }

        .result.active {
            display: block;
        }

        .weather-info {
            margin-bottom: 20px;
        }

        .city-name {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .weather-line {
            font-size: 1.2rem;
            color: #667eea;
            margin-bottom: 20px;
        }

        .weather-image {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .error {
            display: none;
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .error.active {
            display: block;
        }

        .auto-detect {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ 天气图像生成器</h1>
        
        <div class="auto-detect">
            我们会自动检测您的位置，也可以手动输入城市
        </div>

        <div class="input-section">
            <div class="input-group">
                <input type="text" id="cityInput" placeholder="输入城市名称（如：上海、北京）" />
                <button onclick="generateWeatherImage()" id="generateBtn">生成图片</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在为您生成天气图像...</p>
        </div>

        <div class="error" id="error">
            生成失败，请重试
        </div>

        <div class="result" id="result">
            <div class="weather-info">
                <div class="city-name" id="cityName"></div>
                <div class="weather-line" id="weatherLine"></div>
            </div>
            <img id="weatherImage" class="weather-image" alt="天气图像" />
        </div>
    </div>

    <script>
        async function generateWeatherImage() {
            const city = document.getElementById('cityInput').value.trim();
            const generateBtn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const error = document.getElementById('error');

            // 重置状态
            result.classList.remove('active');
            error.classList.remove('active');
            loading.classList.add('active');
            generateBtn.disabled = true;

            try {
                const url = city ? `/api/weather?city=${encodeURIComponent(city)}` : '/api/weather';
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error('网络响应失败');
                }

                const data = await response.json();

                if (data.success) {
                    document.getElementById('cityName').textContent = data.city;
                    document.getElementById('weatherLine').textContent = data.weatherLine;
                    document.getElementById('weatherImage').src = data.image;
                    result.classList.add('active');
                } else {
                    throw new Error(data.error || '生成失败');
                }
            } catch (err) {
                console.error('Error:', err);
                error.textContent = err.message || '生成失败，请重试';
                error.classList.add('active');
            } finally {
                loading.classList.remove('active');
                generateBtn.disabled = false;
            }
        }

        // 页面加载时自动检测位置并生成
        window.addEventListener('load', () => {
            generateWeatherImage();
        });

        // 回车键触发生成
        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                generateWeatherImage();
            }
        });
    </script>
</body>
</html>
